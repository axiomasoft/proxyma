name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: python3 -B scripts/test-rig-selftest.py
      - run: make test-up
      - run: make test-env
      - run: make quality
      - run: make test-all
      - run: make test-report
