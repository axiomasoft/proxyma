name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.8.2
          extensions: curl, pdo_pgsql, mbstring, openssl, intl, gd, bcmath, zip
      - run: composer install --no-interaction --prefer-dist
      - run: python3 -B scripts/test-rig-selftest.py
      - run: make test-up
      - run: python3 scripts/install-fixture.py prepare
      - run: make test-env
      - run: make quality
      - run: make test-all
      - run: make test-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxyma-php84-pg17
          path: |
            build/junit/
            build/test-report.json
            build/installation-*.log
